[project]
name = "radory-backend"
version = "0.1.0"
description = "Radory API and background worker foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.15,<2",
    "boto3>=1.38,<2",
    "celery[redis]>=5.5,<6",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "posthog>=6,<7",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.8,<3",
    "pyjwt[crypto]>=2.10,<3",
    "redis>=5,<7",
    "sentry-sdk[celery,fastapi]>=2.25,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
